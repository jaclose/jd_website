name: publication-email
# Publishing content never implicitly sends the historical archive.
on:
  workflow_dispatch:
    inputs:
      type:
        description: Publication type
        type: choice
        options: [essay, field_note, deployment]
        required: true
      slug:
        description: Exact published slug (AXOM is axom)
        type: string
        required: true
      send:
        description: Send the reviewed draft now
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publication-email
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    environment: newsletter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:newsletter
      - name: Create or send the selected publication
        env:
          PUBLICATION_TYPE: ${{ inputs.type }}
          PUBLICATION_SLUG: ${{ inputs.slug }}
          SEND_PUBLICATION: ${{ inputs.send }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SEGMENT_ESSAYS_ID: ${{ secrets.SEGMENT_ESSAYS_ID }}
          SEGMENT_FIELDNOTES_ID: ${{ secrets.SEGMENT_FIELDNOTES_ID }}
          SEGMENT_DEPLOYMENTS_ID: ${{ secrets.SEGMENT_DEPLOYMENTS_ID }}
          TOPIC_ESSAYS_ID: ${{ secrets.TOPIC_ESSAYS_ID }}
          TOPIC_FIELDNOTES_ID: ${{ secrets.TOPIC_FIELDNOTES_ID }}
          TOPIC_PROJECTS_ID: ${{ secrets.TOPIC_PROJECTS_ID }}
          NEXT_PUBLIC_SITE_URL: https://www.jafardabbagh.com
        run: |
          args=("--type=$PUBLICATION_TYPE" "--slug=$PUBLICATION_SLUG")
          if [ "$SEND_PUBLICATION" = "true" ]; then args+=(--send); fi
          npm run email:dispatch -- "${args[@]}"
      - name: Record provider state
        run: |
          if git diff --quiet data/email-dispatch-log.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/email-dispatch-log.json
          git commit -m "chore(email): record selected publication dispatch"
          git push
